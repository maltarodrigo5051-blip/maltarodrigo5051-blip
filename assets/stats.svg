<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56">
  <defs>
    <filter id="n" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.f{animation:f 4s infinite}@keyframes f{0%,40%,44%,100%{opacity:1}42%{opacity:.4}}</style>
  </defs>
  <rect x="0" y="4" width="316" height="48" rx="12" fill="#0d0d0d" stroke="#b8860b" stroke-opacity=".6"/>
  <rect x="12" y="14" width="6" height="28" rx="3" fill="#ffd700" filter="url(#n)"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></rect>
  <text x="30" y="38" class="t f" font-size="26" font-weight="800" letter-spacing="4" fill="#ffd700" filter="url(#n)">GITHUB STATS</text>
</svg>
